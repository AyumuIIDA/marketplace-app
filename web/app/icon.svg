<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 朱の印（hanko）。既存 Seal コンポーネントと同一の意匠＝頭の円＋上下反転した「人」。
       favicon は小サイズで視認性が要るため badge 版（朱ベタ＋紙色の人型）を採用する。 -->
  <circle cx="16" cy="16" r="16" fill="#d8402f"/>
  <g fill="#fafaf7" transform="translate(5 5) scale(0.9167)">
    <circle cx="12" cy="4.6" r="3.7"/>
    <g transform="translate(0 24) scale(1 -1)">
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="12" y="14">人</text>
    </g>
  </g>
</svg>
