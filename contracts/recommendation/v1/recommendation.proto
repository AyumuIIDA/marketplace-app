syntax = "proto3";

// Recommendation / Visual+Semantic Search モジュールの言語跨ぎ契約（正本）。
// 本体API(Go)の modules/recommendation adapter と recommendation-py(Python) が共有する。
// 設計: prj_context/recommendation-design-iayu6.md
//   dual-vector hybrid = clip_image(CLIP, 画像) + text(Gemini, title+description) を Qdrant で RRF 融合。
package recommendation.v1;

option go_package = "github.com/outarc/marketplace/api-go/internal/modules/recommendation/gen/recommendation/v1;recommendationv1";

service RecommendationService {
  // 自然文 → 画像/説明のhybrid近傍。クエリは両エンコーダでencodeしQdrantで融合。
  rpc SearchByText(SearchByTextRequest) returns (SearchResponse);
  // 画像→画像（事前計算 clip_image の近傍）。入力は listing_id。
  rpc SimilarItems(SimilarItemsRequest) returns (SearchResponse);
  // 1出品の埋め込み生成＋Qdrant upsert（バックフィル / publish時に呼ぶ）。
  rpc IndexListing(IndexListingRequest) returns (IndexListingResponse);
  // hide/delete 同期。
  rpc DeleteListing(DeleteListingRequest) returns (DeleteListingResponse);
  // モデルロード済み & Qdrant到達可能 を返す readiness。
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// 前段の構造化フィルタ（Qdrant payload filter で適用）。
message ListingFilter {
  repeated string categories = 1;        // 空ならカテゴリ非限定
  optional int64 min_price = 2;          // JPY 下限（含む）
  optional int64 max_price = 3;          // JPY 上限（含む）
  optional string status = 4;            // 例: "PUBLISHED"
  string exclude_listing_id = 5;         // SimilarItems で自分自身を除外する用
}

message SearchByTextRequest {
  string query = 1;
  int32 top_k = 2;                       // 既定は呼び出し側で補完（例 24）
  ListingFilter filter = 3;
}

message SimilarItemsRequest {
  string listing_id = 1;
  int32 top_k = 2;
  ListingFilter filter = 3;
}

// 戻りは薄いread-modelのみ。本体APIが listing_id で Cloud SQL から本体を hydrate する。
message Hit {
  string listing_id = 1;
  float score = 2;                       // 融合スコア（大きいほど近い）
}

message SearchResponse {
  repeated Hit hits = 1;
}

message IndexListingRequest {
  string listing_id = 1;
  string image_url = 2;                  // 公開GCS URL。Python側が自前fetchして埋め込む
  string title = 3;
  string description = 4;
  string category = 5;                   // payload
  int64 price = 6;                       // payload (JPY)
  string status = 7;                     // payload
  string seller_id = 8;                  // payload
}

message IndexListingResponse {
  bool indexed = 1;
  string detail = 2;                     // 失敗理由など（任意）
}

message DeleteListingRequest {
  string listing_id = 1;
}

message DeleteListingResponse {
  bool deleted = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ready = 1;                        // model loaded + qdrant reachable
  string detail = 2;
}
