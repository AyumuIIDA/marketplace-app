name: marketplace-local

# ローカル一括起動: db → migrate-domain(goose) / migrate-auth(drizzle) → api → web。
# 起動モードはDevホットリロード（ソースbind mount + tsx watch / next dev）。
# 認証はAuth.js(Google/GitHub OAuth)。auth/domainは単一Postgresの2DBに論理分離。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 初回起動時に marketplace_auth / marketplace_domain を作成
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ワンショット(auth): marketplace_auth へ drizzle migration を適用して終了。webはこの成功を待つ。
  # domain DB は migrate-domain(goose) が単一管理する。アプリ秘密(鍵類)は不要。
  migrate-auth:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgres://app:app@db:5432/marketplace_auth
    command: ["sh", "docker/migrate-auth.sh"]
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # ワンショット(domain): api-go の goose で marketplace_domain へ migration を適用して終了。
  # 新規DBは baseline(00001)+social(00002) を一括作成。apiはこの成功を待つ。
  # 既存DB（別系統で作成済み）は事前に `stamp 1` で baseline を採用しておくこと（README参照）。
  migrate-domain:
    build:
      context: api-go
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/marketplace_domain
    entrypoint: ["/app/migrate"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    # Go版API（正本）。distroless非rootバイナリで $PORT にbind、/healthz でヘルスチェック。
    build:
      context: api-go
      dockerfile: Dockerfile
    # api専用env。BFF内部JWTは【公開鍵のみ】。秘密鍵は注入されない。
    env_file:
      - .env.api
    environment:
      DATABASE_URL: postgres://app:app@db:5432/marketplace_domain
      # ローカルDockerからGemini/Vertex AIを呼ぶため、ホストのADCを明示的に使う。
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
      PORT: "8080"
      # 画像ストレージ。ローカルはfake-gcs、prodはGCSへ endpoint/creds 差し替えのみ。
      # GCS Go SDK は STORAGE_EMULATOR_HOST を自動認識する。
      STORAGE_BUCKET: marketplace-images
      STORAGE_EMULATOR_HOST: http://storage:4443
      # 公開読取URLの基底（ブラウザ到達ホスト）。seed時に listing_images.url を組み立てる。
      PUBLIC_IMAGE_BASE_URL: http://localhost:4443/marketplace-images
      # AI/LLM adapter が画像を取得するためのコンテナ内到達URL。
      IMAGE_FETCH_BASE_URL: http://storage:4443/storage/v1/b/marketplace-images/o
    ports:
      - "8080:8080"
    volumes:
      # ADC(Gemini用)のみマウント。Goはコンパイル済みバイナリなのでソースmountはしない。
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    depends_on:
      migrate-domain:
        condition: service_completed_successfully
      storage:
        condition: service_started

  web:
    # context=リポジトリroot。web/tsconfigが../tsconfig.jsonを継承するためroot tsconfigを同梱する（apiと対称）。
    build:
      context: .
      dockerfile: web/Dockerfile
    # web専用env。BFF内部JWTは【秘密鍵のみ】。公開鍵側(api)とは別ファイル。
    env_file:
      - .env.web
    environment:
      DATABASE_URL: postgres://app:app@db:5432/marketplace_auth
      # BFF→APIはサービス名で到達（サーバ間通信）
      HONO_API_BASE_URL: http://api:8080
      # ブラウザ向けオリジン（Origin検証・OAuthコールバック）
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000/api/auth
      AUTH_TRUST_HOST: "true"
      # 画像はブラウザが storage を直接読む（BFF非経由の公開アセット）。ブラウザ到達のホスト。
      NEXT_PUBLIC_IMAGE_BASE_URL: http://localhost:4443/marketplace-images
    ports:
      - "3000:3000"
    # 全リポジトリを /app にbind（root tsconfig含む）。WORKDIRは/app/web。
    volumes:
      - ./:/app
      - /app/web/node_modules
      - /app/web/.next
    depends_on:
      api:
        condition: service_started
      migrate-auth:
        condition: service_completed_successfully

  # GCSエミュレータ。prodと同じ @google-cloud/storage SDK で endpoint だけ差し替える。
  # 商品画像はブラウザが直接読む公開アセット（BFF非経由）。
  storage:
    image: fsouza/fake-gcs-server:latest
    command:
      - "-scheme=http"
      - "-port=4443"
      - "-public-host=localhost:4443"
      - "-external-url=http://localhost:4443"
      - "-backend=filesystem"
      # 永続ルート。volume(gcsdata)にマウントし、再起動で bucket/objects を復元する。
      - "-filesystem-root=/data"
    ports:
      - "4443:4443"
    volumes:
      - gcsdata:/data

volumes:
  dbdata:
  gcsdata:
