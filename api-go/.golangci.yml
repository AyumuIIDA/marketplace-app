            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/listings"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/orders"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/messages"
            desc: "peer module間importは禁止（workflowで連携する）"
      peer-isolation-aiassistance:
        files: ["**/internal/modules/aiassistance/**"]
        deny:
          - pkg: "marketplace/api-go/internal/modules/identity"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/listings"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/orders"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/messages"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/reviews"
            desc: "peer module間importは禁止（workflowで連携する）"
      peer-isolation-agents:
        files: ["**/internal/modules/agents/**"]
        deny:
          - pkg: "marketplace/api-go/internal/modules/identity"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/listings"
            desc: "peer module間importは禁止（workflowで連携する）"
          - pkg: "marketplace/api-go/internal/modules/orders"
